<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="nav p-2">
        <a class="logo" href="#">
            TaskFlow
        </a>
        <div class="nav-end d-flex align-items-center">
            <h2 id="userGreeting" class="user-name text-white mt-2">Welcome back! Likun</h2>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <!--!Font Awesome Pro v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2026 Fonticons, Inc.-->
                <path
                    d="M463 448.2C440.9 409.8 399.4 384 352 384L288 384C240.6 384 199.1 409.8 177 448.2C212.2 487.4 263.2 512 320 512C376.8 512 427.8 487.3 463 448.2zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320zM320 336C359.8 336 392 303.8 392 264C392 224.2 359.8 192 320 192C280.2 192 248 224.2 248 264C248 303.8 280.2 336 320 336z" />
            </svg>
        </div>
    </nav>
    <div class="task-dashboard-section pt-5 pb-5">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex ">
                        <div class="status-card">
                            <h2 class="status-heading">Total</h2>
                            <p class="status-count">0</p>
                        </div>
                        <div class="status-card">
                            <h2 class="status-heading">Pending</h2>
                            <p class="status-count">0</p>
                        </div>
                        <div class="status-card">
                            <h2 class="status-heading">Complete</h2>
                            <p class="status-count">0</p>
                        </div>
                    </div>
                    <div class="mt-5 d-flex justify-content-center">
                        <input type="text" placeholder="Enter task" class="task-input">
                        <button class="btn btn-primary">Add</button>
                    </div>
                    <div class="task-list-container mt-5">
                        <h2>All Tasks</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link your frontend JavaScript logic -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script src="https://kit.fontawesome.com/e4cdf3e801.js" crossorigin="anonymous"></script>
</body

</html>
