<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Management Dashboard</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="nav">
        <a class="logo" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="12" cy="12" r="8.7" />
                <ellipse cx="12" cy="12" rx="3.6" ry="8.7" />
                <path d="M3.6 9.3h16.8M3.6 14.7h16.8" />
            </svg>
            TaskFlow
        </a>
        <div class="navend">
            <a id="signindBtn" class="btn sm solid rounded-pill" href="#">Sign in</a>
        </div>
    </nav>
    <div class="hero-section pt-5 text-center">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1 class="hero-section-heading text-dark mt-5 mb-3">
                        Organize your work, boost your productivity.
                    </h1>
                    <p class="hero-section-subheading text-muted">
                        A simple, powerful project and task manager designed for focus.
                    </p>
                    <button class="btn btn-dark btn-lg px-5 mt-4 rounded-pill shadow-sm">
                        <a href="#userRegistrationSection" class="text-decoration-none text-white">Get Started</a>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <button id="closeLoginBtn" class="close-btn">&times;</button>
            <h2 class="text-center p-3">Sign In</h2>
            <form id="signInForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signInUsername" class="form-control" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPasword" class="form-control" placeholder="Enter your password">
                </div>
                <div class="text-center mt-4">
                    <button class="btn btn-primary rounded-pill submit-btn">Sign In</button>
                </div>
            </form>
        </div>
    </div> 
    <div id="userRegistrationSection" class="user-registration-section d-flex align-items-center justify-content-center pt-5  pb-5 ps-2 pe-2">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h2 class="text-center mb-4">Sign Up</h2>
                    <form id="registrationForm">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="signUpUsername" placeholder="Enter your username"
                                >
                        </div>
                        <div class="form-group mb-3">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter your name"
                                >
                        </div>
                        <div class="form-group mb-3">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" >
                        </div>
                        <div class="form-group mb-3">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password"
                                >
                        </div>
                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary submit-btn rounded-pill">Sign Up</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="JS/script.js"></script>
</body>

</html>
